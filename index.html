<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mess Menu</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">

        <header>
            <h1>🍽️ Today's Mess Menu</h1>

            <p id="date"></p>
            <p id="weekType"></p>
        </header>


        <section class="menu">

            <div class="meal-card">
                <h2>🍳 Breakfast</h2>
                <p id="breakfast"></p>
            </div>


            <div class="meal-card">
                <h2>🍛 Lunch</h2>
                <p id="lunch"></p>
            </div>


            <div class="meal-card">
                <h2>☕ Snacks</h2>
                <p id="snacks"></p>
            </div>


            <div class="meal-card">
                <h2>🌙 Dinner</h2>
                <p id="dinner"></p>
            </div>

        </section>

    </main>


    <script src="script.js"></script>

</body>
</html>
